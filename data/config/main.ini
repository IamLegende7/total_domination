[Misc]
initial_camera_zoom=4

[Ticking]
# Frame rate to target (= frame limit)
max_frame_rate=60
# How many ticks should be executed every second (THIS WILL MAKE EVERYTHING RUN FASTER)
tick_rate=30
# How often the inputs are processed. Example: a value of 4 means that it will process every 4 ticks
input_tick_rate=1

[Multithreading]
multithreading=false
# -1 for as many the os allows
num_threads=5

[Input]
# 0=keyboard; 1=mouse; 2=mouse&keyboard; 3=touch; 4=gamepad; (5=pen; 6=joystick)
input_mode=0
# Camera & Sensitivity
camera_speed=3
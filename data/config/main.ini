[Misc]
font=$resource_dir$/fonts/RobotoMono-Regular.ttf
#font=$resource_dir$/fonts/Workbench-Regular.ttf
font_size=250 # = 25.0f
initial_camera_zoom=10

[MapLoading]
# Types:
#   - 0: all            : load the entire map on the loading screen
#   - 1: forgetful      : 1. load the chunks arround the palaces 
#                         2. slowly load the chunks in the background up to the render distance, centered on the currently selected chunk
#                         3. forget chunks without any actors in them / in adjacent chunks outside of the render distance
loading_type=0
# in chunks, -1 for infinite (= up to the borders of the map)
render_distance=-1

[ModServer]
# if "default" it uses the platform specific path to the executable shipped with the game
python_executable=default
mod_server_path=$resource_dir$/mod_server/server.py

[Ticking]
# Frame rate to target (= frame limit)
max_frame_rate=60
# How many ticks should be executed every second
tick_rate=30
# How often the inputs are processed. Example: a value of 4 means that it will process every 4 ticks
input_tick_rate=1
animation_frame_rate=12

[Multithreading]
multithreading=true
# -1 for as many the os allows
num_threads=-1

[Input]
# 0=keyboard; 1=mouse; 2=mouse&keyboard; 3=touch; 4=gamepad; (5=pen; 6=joystick)
input_mode=0
# Camera & Sensitivity
camera_speed=5
[Misc]
# The render Mode to use: 0=SDL_GPU; 1=SDL_Renderer; 2=Software(=no GPU at all)
render_mode=1
# Just please dont change this if you dont know what you are doing, it will break stuff
gpu_driver=vulkan
# How big the default Texture atlas should be. A bigger atlas at the beginning might sort many Textures better, but with only a few, it might leave a lot of empty space
texture_atlas_size=0

[Shaders]
online_shaders=true
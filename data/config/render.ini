[Misc]
# The render Mode to use: 0=SDL_GPU (DEPRECATED & UNSUPPORTED); 1=SDL_Renderer; 2=Software(=no GPU, all done on the CPU side)
render_mode=1
# The name of the GPU driver
gpu_driver=vulkan
# How big the default Texture atlas should be. A bigger atlas at the beginning might sort many Textures better, but with only a few, it might leave a lot of empty space
texture_atlas_size=0

[Shaders]
shader=$resource_dir$/shaders/CRT.frag.hlsl
#shader=$resource_dir$/shaders/basic_CRT.frag.hlsl
#shader=$resource_dir$/shaders/basic_greyscale.frag.hlsl
online_shaders=true